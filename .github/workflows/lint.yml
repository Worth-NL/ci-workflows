name: Lint

# Callers use @main, so a broken workflow reaches every repo on merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Every merge to main that passes lint gets a tag: a known point to go back to.
  tag:
    if: github.event_name == 'push'
    needs: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date +%Y%m%d).${{ github.run_number }}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          echo "Tagged $GITHUB_SHA as $tag" >> "$GITHUB_STEP_SUMMARY"
