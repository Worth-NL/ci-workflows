name: Build PR image (shared)

# Builds the production stage and pushes it to GHCR with a -pr tag.

on:
  workflow_call:
    inputs:
      image:
        description: Full image name, e.g. ghcr.io/worth-nl/notifynl-api
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: docker/Dockerfile_nl
    outputs:
      tag:
        description: Tag that was pushed
        value: ${{ jobs.image.outputs.tag }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Set tag
        id: set-tag
        run: echo "tag=$(date +%Y%m%d).${{ github.run_number }}-pr" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Docker build and push ${{ steps.set-tag.outputs.tag }}
        uses: docker/build-push-action@v6
        with:
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image }}:${{ steps.set-tag.outputs.tag }}
          platforms: linux/amd64
          provenance: false
          target: production
